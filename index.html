<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Welile - Africa's Rent Facilitation Platform</title>
    <meta name="description" content="Welile Technologies - Africa's leading rent facilitation platform. Access rent today, pay back over time." />
    <link rel="icon" href="/favicon.png" type="image/png" />
    
    <!-- Critical: Preconnect early -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://wirntoujqoyjobfhyelc.supabase.co" crossorigin>
    <link rel="dns-prefetch" href="https://wirntoujqoyjobfhyelc.supabase.co">
    
    <!-- Chewy Font for Logo -->
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
    
    <!-- PWA -->
    <meta name="theme-color" content="#7c3aed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph -->
    <meta property="og:title" content="Welile - Rent Facilitation" />
    <meta property="og:description" content="Access rent today, pay back over time." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.png" />

    <!-- Inline critical CSS for instant first paint -->
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      html{font-family:system-ui,-apple-system,sans-serif;background:#f8fafc}
      body{min-height:100vh}
      #root{min-height:100vh}
      .app-loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#f8fafc 0%,#ede9fe 50%,#f8fafc 100%);z-index:9999;gap:24px;opacity:1;transition:opacity 0.4s ease-out,visibility 0.4s ease-out}
      .app-loader.fade-out{opacity:0;visibility:hidden}
      .loader-logo{font-family:'Chewy',cursive;font-size:2.5rem;color:#7c3aed;animation:pulse-logo 2s ease-in-out infinite;margin-bottom:-16px}
      .loader-tagline{font-size:0.875rem;color:#64748b;margin-bottom:8px}
      .loader-spinner{width:40px;height:40px;border:3px solid rgba(124,58,237,0.2);border-top-color:#7c3aed;border-radius:50%;animation:spin .6s linear infinite}
      .loader-text{font-size:0.75rem;color:#94a3b8;margin-top:-8px}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pulse-logo{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.7;transform:scale(1.05)}}
      @media(prefers-color-scheme:dark){
        html{background:#0f172a}
        .app-loader{background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#0f172a 100%)}
        .loader-logo{color:#a78bfa}
        .loader-spinner{border-color:rgba(167,139,250,0.2);border-top-color:#a78bfa}
        .loader-text{color:#94a3b8}
      }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- Branded loading state -->
      <div class="app-loader" id="app-loader">
        <div class="loader-logo">Welile</div>
        <div class="loader-tagline">Rent Facilitation Platform</div>
        <div class="loader-spinner"></div>
        <div class="loader-text">Loading...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Smooth fade-out when app mounts
      window.addEventListener('load', function() {
        setTimeout(function() {
          var loader = document.getElementById('app-loader');
          if (loader) {
            loader.classList.add('fade-out');
            setTimeout(function() {
              loader.style.display = 'none';
            }, 400);
          }
        }, 100);
      });
    </script>
  </body>
</html>
