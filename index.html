<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Welile - Africa's Rent Facilitation Platform</title>
    <meta name="description" content="Welile Technologies - Africa's leading rent facilitation platform. Access rent today, pay back over time." />
    <link rel="icon" href="/favicon.png" type="image/png" />
    
    <!-- Critical: Preconnect early -->
    <link rel="preconnect" href="https://wirntoujqoyjobfhyelc.supabase.co" crossorigin>
    <link rel="dns-prefetch" href="https://wirntoujqoyjobfhyelc.supabase.co">
    
    <!-- PWA -->
    <meta name="theme-color" content="#7c3aed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph -->
    <meta property="og:title" content="Welile - Rent Facilitation" />
    <meta property="og:description" content="Access rent today, pay back over time." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.png" />

    <!-- Inline critical CSS for instant first paint -->
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      html{font-family:system-ui,-apple-system,sans-serif;background:#f8fafc}
      body{min-height:100vh}
      #root{min-height:100vh}
      .app-loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f8fafc;z-index:9999}
      .app-loader.dark{background:#0f172a}
      .loader-spinner{width:32px;height:32px;border:3px solid #e2e8f0;border-top-color:#7c3aed;border-radius:50%;animation:spin .6s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @media(prefers-color-scheme:dark){html{background:#0f172a}.app-loader{background:#0f172a}.loader-spinner{border-color:#334155;border-top-color:#a78bfa}}
    </style>
  </head>

  <body>
    <div id="root">
      <!-- Instant loading state -->
      <div class="app-loader" id="app-loader">
        <div class="loader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove loader when app mounts
      window.addEventListener('load', function() {
        setTimeout(function() {
          var loader = document.getElementById('app-loader');
          if (loader) loader.style.display = 'none';
        }, 100);
      });
    </script>
  </body>
</html>
