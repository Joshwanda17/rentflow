<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, user-scalable=yes" />
    <title>Welile.com - Africa's Rent Facilitation Platform</title>
    <meta name="description" content="Welile.com - Africa's leading rent facilitation platform. Access rent today, pay back over time." />
    <link rel="icon" type="image/png" href="/welile-logo.png" />
    
    <!-- Critical: Preconnect early -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://wirntoujqoyjobfhyelc.supabase.co">
    <link rel="dns-prefetch" href="https://api.exchangerate-api.com">
    
    <!-- Fonts - Non-blocking async load -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Chewy&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Chewy&display=swap" rel="stylesheet"></noscript>
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7c3aed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#5b21b6" media="(prefers-color-scheme: dark)" />
    
    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Welile.com" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" sizes="180x180" href="/welile-logo.png" />
    <link rel="apple-touch-icon" href="/welile-logo.png" />
    <link rel="apple-touch-startup-image" href="/welile-logo.png" />
    
    <!-- Android PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="HandheldFriendly" content="true" />

    <!-- Open Graph -->
    <meta property="og:title" content="Welile.com - Rent Facilitation" />
    <meta property="og:description" content="Access rent today, pay back over time." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/welile-logo.png" />

    <!-- Minimal critical CSS -->
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      html{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:#f8fafc;-webkit-font-smoothing:antialiased}
      body{min-height:100vh;min-height:100dvh}
      #root{min-height:100vh;min-height:100dvh}
      @media(prefers-color-scheme:dark){html{background:#0f172a}}
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
