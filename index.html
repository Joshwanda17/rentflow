<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, user-scalable=yes" />
    <title>Welile.com - Africa's Rent Facilitation Platform</title>
    <meta name="description" content="Welile.com - Africa's leading rent facilitation platform. Access rent today, pay back over time." />
    <link rel="icon" type="image/png" sizes="192x192" href="/welile-logo.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/welile-logo.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/welile-logo.png" />
    <link rel="shortcut icon" type="image/png" href="/welile-logo.png" />
    
    <!-- Critical: Preconnect early -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://wirntoujqoyjobfhyelc.supabase.co" crossorigin>
    <link rel="dns-prefetch" href="https://wirntoujqoyjobfhyelc.supabase.co">
    
    <!-- Fonts - Async loading for performance -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Chewy&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Chewy&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Chewy&display=swap" rel="stylesheet"></noscript>
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7c3aed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#5b21b6" media="(prefers-color-scheme: dark)" />
    
    <!-- iOS PWA Meta Tags - Enhanced -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Welile.com" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- iOS Touch Icons - Multiple Sizes -->
    <link rel="apple-touch-icon" href="/welile-logo.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/welile-logo.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/welile-logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/welile-logo.png" />
    
    <!-- iOS Splash Screens -->
    <link rel="apple-touch-startup-image" href="/welile-logo.png" />
    
    <!-- Prevent iOS Text Size Adjustment -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    
    <!-- Android PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Disable callout on iOS -->
    <meta name="touch-callout" content="none" />

    <!-- Open Graph -->
    <meta property="og:title" content="Welile.com - Rent Facilitation" />
    <meta property="og:description" content="Access rent today, pay back over time." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/welile-logo.png" />

    <!-- Inline critical CSS for instant first paint -->
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      html{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:#f8fafc;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
      body{min-height:100vh}
      #root{min-height:100vh}
      .app-loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#f8fafc 0%,#ede9fe 50%,#f8fafc 100%);z-index:9999;gap:24px;opacity:1;transition:opacity 0.5s ease-out,visibility 0.5s ease-out;overflow:hidden}
      .app-loader.fade-out{opacity:0;visibility:hidden}
      .app-loader.fade-out .loader-content{transform:scale(1.1);opacity:0}
      .loader-content{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;gap:20px;transition:transform 0.5s ease-out,opacity 0.5s ease-out}
      .loader-logo-container{position:relative;display:flex;align-items:center;justify-content:center}
      .loader-logo-ring{position:absolute;width:100px;height:100px;border-radius:50%;border:2px solid transparent;border-top-color:#7c3aed;border-right-color:#a78bfa;animation:ring-spin 1.5s linear infinite}
      .loader-logo-ring:nth-child(2){width:120px;height:120px;border-top-color:#a78bfa;border-right-color:#7c3aed;animation-direction:reverse;animation-duration:2s}
      .loader-logo-icon{width:64px;height:64px;border-radius:16px;overflow:hidden;box-shadow:0 10px 40px rgba(124,58,237,0.3);animation:logo-bounce 2s ease-in-out infinite}
      .loader-logo-icon img{width:100%;height:100%;object-fit:cover}
      .loader-brand{font-family:'Chewy',cursive;font-size:2.5rem;color:#7c3aed;animation:shimmer 2s ease-in-out infinite;background:linear-gradient(90deg,#7c3aed 0%,#a78bfa 50%,#7c3aed 100%);background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
      .loader-tagline{font-size:0.875rem;color:#64748b;opacity:0;animation:fade-up 0.6s ease-out 0.3s forwards}
      .loader-progress{width:180px;height:4px;background:rgba(124,58,237,0.2);border-radius:4px;overflow:hidden;margin-top:8px}
      .loader-progress-bar{height:100%;background:linear-gradient(90deg,#7c3aed,#a78bfa);border-radius:4px;width:0%;transition:width 0.3s ease-out}
      .loader-percentage{font-family:'Chewy',cursive;font-size:1.5rem;color:#7c3aed;margin-top:8px;font-weight:bold}
      .loader-text{font-size:0.75rem;color:#94a3b8;margin-top:4px}
      .loader-skip{margin-top:20px;padding:8px 24px;background:transparent;border:1.5px solid rgba(124,58,237,0.4);border-radius:20px;color:#7c3aed;font-size:0.875rem;font-weight:500;cursor:pointer;transition:all 0.2s ease;opacity:0;animation:fade-up 0.6s ease-out 1s forwards}
      .loader-skip:hover{background:rgba(124,58,237,0.1);border-color:#7c3aed;transform:scale(1.05)}
      .loader-skip:active{transform:scale(0.98)}
      .loader-particles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
      .particle{position:absolute;border-radius:50%;opacity:0;animation:particle-float 8s ease-in-out infinite}
      .particle:nth-child(1){width:80px;height:80px;background:radial-gradient(circle,rgba(124,58,237,0.3),transparent);top:10%;left:10%;animation-delay:0s}
      .particle:nth-child(2){width:120px;height:120px;background:radial-gradient(circle,rgba(167,139,250,0.25),transparent);top:60%;right:10%;animation-delay:-2s}
      .particle:nth-child(3){width:60px;height:60px;background:radial-gradient(circle,rgba(124,58,237,0.2),transparent);bottom:20%;left:20%;animation-delay:-4s}
      .particle:nth-child(4){width:100px;height:100px;background:radial-gradient(circle,rgba(167,139,250,0.2),transparent);top:30%;right:25%;animation-delay:-1s}
      .particle:nth-child(5){width:50px;height:50px;background:radial-gradient(circle,rgba(124,58,237,0.25),transparent);bottom:30%;right:30%;animation-delay:-3s}
      .particle:nth-child(6){width:70px;height:70px;background:radial-gradient(circle,rgba(167,139,250,0.3),transparent);top:50%;left:5%;animation-delay:-5s}
      @keyframes ring-spin{to{transform:rotate(360deg)}}
      @keyframes logo-bounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.02)}}
      @keyframes shimmer{0%,100%{background-position:200% 0}50%{background-position:-200% 0}}
      @keyframes fade-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
      @keyframes progress{0%{width:0%}50%{width:100%}100%{width:0%}}
      @keyframes particle-float{0%{opacity:0;transform:translateY(20px) scale(0.8)}10%{opacity:0.4}50%{transform:translateY(-20px) translateX(-10px) scale(1.1)}90%{opacity:0.4}100%{opacity:0;transform:translateY(20px) translateX(10px) scale(0.8)}}
      @media(prefers-color-scheme:dark){
        html{background:#0f172a}
        .app-loader{background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#0f172a 100%)}
        .loader-brand{background:linear-gradient(90deg,#a78bfa 0%,#c4b5fd 50%,#a78bfa 100%);background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .loader-logo-ring{border-top-color:#a78bfa;border-right-color:#7c3aed}
        .loader-logo-ring:nth-child(2){border-top-color:#7c3aed;border-right-color:#a78bfa}
        .loader-logo-icon{box-shadow:0 10px 40px rgba(167,139,250,0.3)}
        .loader-progress{background:rgba(167,139,250,0.2)}
        .loader-progress-bar{background:linear-gradient(90deg,#a78bfa,#c4b5fd)}
        .loader-text{color:#94a3b8}
        .loader-tagline{color:#94a3b8}
        .particle:nth-child(1){background:radial-gradient(circle,rgba(167,139,250,0.3),transparent)}
        .particle:nth-child(2){background:radial-gradient(circle,rgba(124,58,237,0.25),transparent)}
        .particle:nth-child(3){background:radial-gradient(circle,rgba(167,139,250,0.2),transparent)}
        .particle:nth-child(4){background:radial-gradient(circle,rgba(124,58,237,0.2),transparent)}
        .particle:nth-child(5){background:radial-gradient(circle,rgba(167,139,250,0.25),transparent)}
        .particle:nth-child(6){background:radial-gradient(circle,rgba(124,58,237,0.3),transparent)}
        .loader-skip{border-color:rgba(167,139,250,0.4);color:#a78bfa}
        .loader-skip:hover{background:rgba(167,139,250,0.15);border-color:#a78bfa}
        .loader-percentage{color:#a78bfa}
      }
      /* PWA standalone mode - extended splash */
      @media(display-mode:standalone){
        .loader-logo-icon{width:80px;height:80px;border-radius:20px}
        .loader-logo-ring{width:120px;height:120px}
        .loader-logo-ring:nth-child(2){width:144px;height:144px}
        .loader-brand{font-size:3rem}
      }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- Branded loading state -->
      <div class="app-loader" id="app-loader">
        <div class="loader-particles">
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
        </div>
        <div class="loader-content">
          <div class="loader-logo-container">
            <div class="loader-logo-ring"></div>
            <div class="loader-logo-ring"></div>
            <div class="loader-logo-icon">
              <img src="/welile-logo.png" alt="Welile" />
            </div>
          </div>
          <div class="loader-brand">Welile.com</div>
          <div class="loader-tagline">Rent Facilitation Platform</div>
          <div class="loader-progress">
            <div class="loader-progress-bar" id="progress-bar"></div>
          </div>
          <div class="loader-percentage" id="loader-percentage">0%</div>
          <div class="loader-text" id="loader-text">Initializing...</div>
          <button class="loader-skip" id="skip-btn" onclick="skipSplash()">Skip</button>
        </div>
      </div>
    </div>
    <script>
      // Instant loading for returning users
      (function(){
        var skip = localStorage.getItem('welile_visited') === 'true';
        var l = document.getElementById('app-loader');
        if (skip && l) { l.remove(); return; }
        try { localStorage.setItem('welile_visited', 'true'); } catch(e){}
        
        // Quick progress for first visit only
        var bar = document.getElementById('progress-bar');
        var pct = document.getElementById('loader-percentage');
        var txt = document.getElementById('loader-text');
        var steps = [[30,'Loading...'],[70,'Almost ready...'],[100,'Welcome!']];
        steps.forEach(function(s,i){
          setTimeout(function(){
            if(bar) bar.style.width = s[0]+'%';
            if(pct) pct.textContent = s[0]+'%';
            if(txt) txt.textContent = s[1];
          }, i*100);
        });
        
        window.hideSplash = function(){
          if(l){ l.classList.add('fade-out'); setTimeout(function(){ l.remove(); },200); }
        };
        window.skipSplash = function(){ if(navigator.vibrate)navigator.vibrate(10); window.hideSplash(); };
        setTimeout(window.hideSplash, 500);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
