    <!-- Inline critical CSS for instant first paint -->
    <!-- Simplified critical CSS for faster first paint -->
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      html{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:#f8fafc;-webkit-font-smoothing:antialiased}
      body{min-height:100vh}
      #root{min-height:100vh}
      .app-loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f8fafc;z-index:9999;gap:16px;opacity:1;transition:opacity 0.3s ease-out}
      .app-loader.fade-out{opacity:0;pointer-events:none}
      .loader-content{display:flex;flex-direction:column;align-items:center;gap:16px}
      .loader-logo-icon{width:64px;height:64px;border-radius:16px;overflow:hidden}
      .loader-logo-icon img{width:100%;height:100%;object-fit:cover}
      .loader-brand{font-family:'Chewy',cursive;font-size:2rem;color:#7c3aed}
      .loader-progress{width:160px;height:3px;background:#e5e7eb;border-radius:3px;overflow:hidden}
      .loader-progress-bar{height:100%;background:#7c3aed;border-radius:3px;width:0%;transition:width 0.2s}
      .loader-text{font-size:0.75rem;color:#9ca3af}
      @media(prefers-color-scheme:dark){
        html{background:#0f172a}
        .app-loader{background:#0f172a}
        .loader-brand{color:#a78bfa}
        .loader-progress{background:#334155}
        .loader-progress-bar{background:#a78bfa}
        .loader-text{color:#64748b}
      }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- Simplified loading state for faster first paint -->
      <div class="app-loader" id="app-loader">
        <div class="loader-content">
          <div class="loader-logo-icon">
            <img src="/welile-logo.png" alt="Welile" width="64" height="64" />
          </div>
          <div class="loader-brand">Welile</div>
          <div class="loader-progress">
            <div class="loader-progress-bar" id="progress-bar"></div>
          </div>
          <div class="loader-text" id="loader-text">Loading...</div>
        </div>
      </div>
    </div>
    <script>
      // Fast loader - skip for returning users
      (function(){
        var l = document.getElementById('app-loader');
        if (localStorage.getItem('welile_visited')) { if(l) l.remove(); return; }
        try { localStorage.setItem('welile_visited', '1'); } catch(e){}
        var bar = document.getElementById('progress-bar');
        var txt = document.getElementById('loader-text');
        setTimeout(function(){ if(bar) bar.style.width = '60%'; }, 50);
        setTimeout(function(){ if(bar) bar.style.width = '100%'; if(txt) txt.textContent = 'Ready!'; }, 150);
        window.hideSplash = function(){ if(l){ l.classList.add('fade-out'); setTimeout(function(){ l.remove(); }, 300); } };
        setTimeout(window.hideSplash, 300);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
