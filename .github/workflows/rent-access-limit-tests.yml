name: Rent Access Limit Tests

# Runs the pure-logic unit tests for the tenant Rent Access Limit
# calculator on every push and pull request. Intended as a REQUIRED
# status check so a regression in the limit formula (zero/cap clamp,
# tier thresholds, same-day dedupe, runtime overrides) blocks merges.
#
# Scope is intentionally narrow — only `src/lib/__tests__/rentAccessLimit.test.ts`
# (10 tests, ~30ms) — to keep the gate fast and signal-rich.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: rent-access-limit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rent-access-limit-tests:
    name: rent-access-limit-tests (${{ matrix.runtime }} ${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Small runtime matrix: two Bun versions (stable + latest) and two
    # Node LTS lines. Bun is the primary dev runtime; the Node entries
    # catch environment-specific regressions (date math, Intl, V8 quirks).
    # fail-fast: false so one bad matrix cell doesn't mask the others.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: bun
            version: '1.1.38'
          - runtime: bun
            version: latest
          - runtime: node
            version: '20'
          - runtime: node
            version: '22'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.version }}

      - name: Setup Node
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}

      # Bun still needed under the Node matrix cells so we can install
      # deps from bun.lock without forcing an npm/yarn lockfile in repo.
      - name: Setup Bun (installer for node cells)
        if: matrix.runtime == 'node'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Cache Bun's global module store keyed on the lockfile so repeat runs
      # on the same dependency set skip the network download entirely. The
      # restore-keys fallback still gives a warm cache after lockfile bumps.
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ matrix.runtime }}-${{ matrix.version }}-${{ hashFiles('bun.lockb', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ matrix.runtime }}-${{ matrix.version }}-
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run rentAccessLimit unit tests with coverage
        # Thresholds are scoped to src/lib/rentAccessLimit.ts only so the
        # gate measures the formula we actually own. CI fails if any of
        # statements/lines/functions drops below 100% or branches below 85%.
        # Runner is chosen by the matrix: `bunx` under Bun, `npx` under Node
        # so the test actually executes on the targeted runtime.
        env:
          RUNNER: ${{ matrix.runtime == 'bun' && 'bunx' || 'npx --no-install' }}
        run: |
          $RUNNER vitest run src/lib/__tests__/rentAccessLimit.test.ts \
            --reporter=verbose \
            --coverage \
            --coverage.provider=v8 \
            --coverage.include='src/lib/rentAccessLimit.ts' \
            --coverage.reporter=text \
            --coverage.reporter=lcov \
            --coverage.reportsDirectory=coverage/rent-access-limit \
            --coverage.thresholds.lines=100 \
            --coverage.thresholds.statements=100 \
            --coverage.thresholds.functions=100 \
            --coverage.thresholds.branches=85

      - name: Upload coverage report
        # One artifact per matrix cell to keep them distinct.
        if: always() && matrix.runtime == 'bun' && matrix.version == 'latest'
        uses: actions/upload-artifact@v4
        with:
          name: rent-access-limit-coverage
          path: coverage/rent-access-limit
          if-no-files-found: ignore
          retention-days: 14